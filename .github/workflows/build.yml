name: Build and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream branch/tag to build (e.g. main, v2.0.0)"
        required: false
        default: "main"
  schedule:
    # Monthly check against upstream main (1st, 3am UTC). The heavy build
    # is skipped when the upstream commit hasn't changed, so idle months
    # cost seconds.
    - cron: "0 3 1 * *"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  UPSTREAM_REPO: https://github.com/andrei-savin/m3u4me.git

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout wrapper repo
        uses: actions/checkout@v4

      - name: Resolve upstream SHA
        id: upstream
        run: |
          REF="${{ inputs.upstream_ref }}"
          if [ -z "$REF" ]; then REF="main"; fi
          SHA=$(git ls-remote "$UPSTREAM_REPO" "$REF" | awk '{print $1}')
          if [ -z "$SHA" ]; then echo "Could not resolve upstream ref $REF"; exit 1; fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Upstream $REF = $SHA"
          echo "$SHA" > .upstream-sha

      - name: Check if this upstream commit was already built
        id: upstream-cache
        uses: actions/cache@v4
        with:
          path: .upstream-sha
          key: upstream-${{ steps.upstream.outputs.sha }}

      - name: Set up QEMU (ARM emulation for multi-arch)
        if: steps.upstream-cache.outputs.cache-hit != 'true' || github.event_name != 'schedule'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.upstream-cache.outputs.cache-hit != 'true' || github.event_name != 'schedule'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.upstream-cache.outputs.cache-hit != 'true' || github.event_name != 'schedule'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        if: steps.upstream-cache.outputs.cache-hit != 'true' || github.event_name != 'schedule'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        if: steps.upstream-cache.outputs.cache-hit != 'true' || github.event_name != 'schedule'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            UPSTREAM_REF=${{ steps.upstream.outputs.ref }}
            UPSTREAM_SHA=${{ steps.upstream.outputs.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
